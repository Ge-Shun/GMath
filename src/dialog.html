<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GMath 公式编辑</title>

  <!-- Office.js（对话框里只用到 messageParent，仍须经典脚本加载） -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <!-- MathLive 可视化编辑器 -->
  <script defer src="https://cdn.jsdelivr.net/npm/mathlive"></script>

  <style>
    :root { --fg:#201f1e; --muted:#605e5c; --accent:#0f6cbd; --border:#e1dfdd; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
           color:var(--fg); padding:14px; font-size:14px; }
    h1 { font-size:15px; margin:0 0 10px; }
    math-field { display:block; width:100%; min-height:80px; font-size:24px; padding:8px;
                 border:1px solid var(--border); border-radius:6px; background:#fff; }
    math-field:focus-within { border-color:var(--accent); }
    .palette { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; }
    .palette button { background:#fff; color:var(--fg); border:1px solid var(--border);
                      padding:4px 8px; font-size:16px; border-radius:6px; cursor:pointer; }
    .latex-box { margin-top:10px; }
    .latex-box label { display:block; color:var(--muted); font-size:12px; margin-bottom:4px; }
    textarea { width:100%; min-height:48px; font-family:ui-monospace,Menlo,Consolas,monospace;
               font-size:13px; padding:8px; border:1px solid var(--border); border-radius:6px; resize:vertical; }
    .row { display:flex; gap:8px; align-items:center; margin-top:12px; flex-wrap:wrap; }
    button.action { font:inherit; padding:8px 16px; border-radius:6px; border:1px solid var(--accent);
                    background:var(--accent); color:#fff; cursor:pointer; }
    button.secondary { background:#fff; color:var(--accent); }
    label.check { display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:13px; }
    .status { margin-top:10px; font-size:12px; color:var(--muted); min-height:16px; white-space:pre-wrap; }
    .status.err { color:#a4262c; }
  </style>
</head>
<body>
  <h1 id="title">编辑公式</h1>

  <div class="palette" id="palette">
    <button data-insert="\frac{#0}{#0}">a/b</button>
    <button data-insert="\sqrt{#0}">√</button>
    <button data-insert="x^{#0}">xⁿ</button>
    <button data-insert="x_{#0}">xₙ</button>
    <button data-insert="\sum_{#0}^{#0}">∑</button>
    <button data-insert="\int_{#0}^{#0}">∫</button>
    <button data-insert="\lim_{#0}">lim</button>
    <button data-insert="\begin{pmatrix}#0\end{pmatrix}">( )</button>
  </div>

  <math-field id="mathfield"></math-field>

  <div class="latex-box">
    <label for="latex">LaTeX（双向同步，可直接编辑）</label>
    <textarea id="latex" spellcheck="false"></textarea>
  </div>

  <div class="row">
    <button id="okBtn" class="action">插入</button>
    <button id="cancelBtn" class="secondary action">取消</button>
    <label class="check">
      <input type="checkbox" id="displayMode" checked />
      独立成行（显示公式）
    </label>
  </div>

  <div class="status" id="status"></div>

  <script type="module" src="./dialog.js"></script>
</body>
</html>
