<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GMath 公式</title>

  <script>
    window.__gmathBoot = { start: performance.now(), marks: [] };
    window.__gmathMark = function (name) {
      window.__gmathBoot.marks.push({
        name: name,
        ms: Math.round(performance.now() - window.__gmathBoot.start)
      });
    };
  </script>

  <link rel="stylesheet" href="./vendor/mathlive/mathlive-fonts.css" />

  <!-- 本地化显示字体：Fraunces（字标衬线）+ JetBrains Mono（LaTeX 源）；中文回退系统字体 -->
  <link rel="stylesheet" href="./vendor/fonts/fonts.css" />

  <!-- Office.js（必须以经典脚本方式加载） -->
  <script
    src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"
    onload="window.__gmathMark && window.__gmathMark('office.js loaded')"
    onerror="window.__gmathMark && window.__gmathMark('office.js failed')"
  ></script>

  <!-- MathLive：可视化公式编辑器，自动注册 <math-field> 元素 -->
  <script
    defer
    src="./vendor/mathlive/mathlive.min.js"
    onload="window.__gmathMark && window.__gmathMark('mathlive loaded')"
    onerror="window.__gmathMark && window.__gmathMark('mathlive failed')"
  ></script>

  <link rel="stylesheet" href="./taskpane.css?v=2026-06-15-decorations" />
</head>
<body>
  <header class="reveal">
    <img class="mark" src="../assets/icon-80.png" alt="GMath" width="38" height="38" />
    <div class="brand">
      <h1><span class="gm">GMath</span> <span data-i18n="appTitle">公式</span></h1>
    </div>
    <button type="button" id="langBtn" class="lang-btn" title="中文 / English">EN</button>
  </header>

  <p class="eyebrow reveal" data-i18n="ebSymbols">符号速选</p>
  <div class="palette reveal" id="palette">
    <div class="cat-tabs" id="catTabs"></div>
    <div class="sym-grid" id="symGrid"></div>
  </div>

  <p class="eyebrow reveal"><span data-i18n="ebImage">图片转公式 · AI 识别</span>
    <button type="button" id="aiSettingsBtn" class="eyebrow-btn"
            data-i18n="apiSettings" data-i18n-title="apiSettingsTitle"
            title="配置大模型接口">⚙ 接口设置</button>
  </p>
  <div class="ai reveal">
    <div class="ai-drop" id="aiDrop" tabindex="0" data-i18n-title="aiDropTitle" title="粘贴或点击选择图片">
      <input type="file" id="aiFile" accept="image/*" hidden />
      <div class="ai-hint" id="aiHint">
        <span class="ai-cam">📷</span>
        <span data-i18n-html="aiHint">粘贴截图（Ctrl/⌘+V）<br />或点击 / 拖入图片</span>
      </div>
      <img id="aiThumb" class="ai-thumb" hidden alt="" />
    </div>
    <div class="ai-status" id="aiStatus" hidden></div>

    <div class="ai-settings" id="aiSettings" hidden>
      <label><span data-i18n="aiUrlLabel">API 地址</span>
        <input type="text" id="aiUrl" spellcheck="false" data-i18n-ph="aiUrlPh"
               placeholder="https://api.openai.com/v1/chat/completions" />
      </label>
      <label><span data-i18n="aiKeyLabel">API Key</span>
        <input type="password" id="aiKey" spellcheck="false" placeholder="sk-..." />
      </label>
      <label><span data-i18n="aiModelLabel">模型（需支持图片/视觉）</span>
        <input type="text" id="aiModel" spellcheck="false" data-i18n-ph="aiModelPh"
               placeholder="如 gpt-4o / glm-4v / qwen-vl-max" />
      </label>
      <div class="ai-srow">
        <button type="button" id="aiSaveBtn" data-i18n="aiSave">保存设置</button>
        <span class="ai-note" data-i18n="aiNote">仅存于本机浏览器；识别时把图片与 Key 发送到你填写的接口。</span>
      </div>
    </div>
  </div>

  <div class="field-card reveal">
    <math-field id="mathfield"></math-field>
  </div>

  <div class="mode" id="modeLine">新建公式</div>

  <div class="row reveal">
    <button id="insertBtn" data-i18n="insert" disabled>插入到 Word</button>
    <button id="clearBtn" class="secondary" data-i18n="clear">清空</button>
    <div class="seg" id="layoutMode" role="group" aria-label="公式版式">
      <button type="button" data-mode="inline" data-i18n="inline" data-i18n-title="inlineTitle" title="行内公式：嵌入正文行中">行内</button>
      <button type="button" data-mode="display" class="active" data-i18n="display" data-i18n-title="displayTitle" title="行间公式：独立居中成行">行间</button>
      <button type="button" data-mode="numbered" data-i18n="numbered" data-i18n-title="numberedTitle" title="右编号公式：居中成行，右侧加编号">右编号</button>
    </div>
  </div>

  <div class="eqnum-row reveal" id="eqNumberRow" hidden>
    <input type="text" id="eqNumber" spellcheck="false" data-i18n-ph="eqNumberPh"
           placeholder="留空＝自动编号（Word SEQ，会自动续号）；或自定义如 (3.1)" />
  </div>

  <div class="latex-box reveal">
    <p class="eyebrow" data-i18n="ebLatex">LaTeX 源 · 双向同步</p>
    <textarea id="latex" spellcheck="false" data-i18n-ph="latexPh" placeholder="在此输入 LaTeX"></textarea>
  </div>

  <div class="status reveal" id="status">正在初始化…</div>

  <details class="reveal">
    <summary data-i18n="debugSummary">查看转换得到的 OMML / MathML（调试用）</summary>
    <textarea id="debug" readonly style="min-height:120px;margin-top:8px;"></textarea>
  </details>

  <script
    type="module"
    src="./taskpane.js?v=2026-06-15-decorations"
    onload="window.__gmathMark && window.__gmathMark('taskpane module loaded')"
    onerror="window.__gmathMark && window.__gmathMark('taskpane module failed')"
  ></script>
</body>
</html>
